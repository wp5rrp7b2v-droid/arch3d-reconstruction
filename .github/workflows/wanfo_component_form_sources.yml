name: Wanfo component form primary-source retrieval
on:
  push:
    branches: [evidence/component-form-reference-v001]
    paths:
      - docs/component_form_reference_v001/tools/collect_sources.py
      - .github/workflows/wanfo_component_form_sources.yml
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - run: python docs/component_form_reference_v001/tools/collect_sources.py
      - name: Save source extracts to this evidence branch only
        run: |
          test "$GITHUB_REF_NAME" = evidence/component-form-reference-v001
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/component_form_reference_v001/assets/research
          git diff --cached --quiet || git commit -m "归档形制补查的原始图片与来源获取结果"
          git push origin HEAD:evidence/component-form-reference-v001
