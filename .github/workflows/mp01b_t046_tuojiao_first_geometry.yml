name: MP-01B T-046 Tuojiao First Geometry

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/mp01b_t046_tuojiao_first_geometry.yml'
      - 'docs/tasks/T-046_MP01B_TUOJIAO_FIRST_GEOMETRY_BUILD_V001.md'
      - 'production/zhenguo_wanfo/assembly/MP01B_GATE_T3_TUOJIAO_FIRST_GEOMETRY_BUILD_PREPARATION_V001.json'
      - 'production/zhenguo_wanfo/scripts/mp01b_tuojiao_first_geometry_build_v001.py'
      - 'production/zhenguo_wanfo/scripts/validate_mp01b_tuojiao_first_geometry_v001.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER: /tmp/blender-4.5.13-linux-x64/blender
      CONTRACT: production/zhenguo_wanfo/assembly/MP01B_GATE_T3_TUOJIAO_FIRST_GEOMETRY_BUILD_PREPARATION_V001.json
      BUILDER: production/zhenguo_wanfo/scripts/mp01b_tuojiao_first_geometry_build_v001.py
      VALIDATOR: production/zhenguo_wanfo/scripts/validate_mp01b_tuojiao_first_geometry_v001.py
      OUT: artifacts/mp01b_t046_tuojiao
      REVIEW: artifacts/mp01b_t046_tuojiao/review
      ASSET: artifacts/mp01b_t046_tuojiao/MP01B_TUOJIAO_FIRST_GEOMETRY_V001.blend
      SEM: artifacts/mp01b_t046_tuojiao/MP01B_TUOJIAO_FIRST_GEOMETRY_SEMANTIC_V001.json
      BOARD: artifacts/mp01b_t046_tuojiao/MP01B_T046_REVIEW_BOARD_V001.png
      VAL: artifacts/mp01b_t046_tuojiao/MP01B_T046_VALIDATION_V001.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Blender 4.5.13 and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 fonts-noto-cjk
          curl --fail --location --show-error --retry 3 --user-agent "Mozilla/5.0 GitHubActions T046" -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C /tmp
          "$BLENDER" --version | grep -Eq '^Blender 4\.5\.13( LTS)?$'
          python -m pip install --disable-pip-version-check pillow

      - name: T3 authorization precheck
        shell: bash
        run: |
          set -euo pipefail
          python - "$CONTRACT" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1],encoding="utf-8"))
          assert c["tuojiao_first_build_authorization"]["authorized"] is True
          assert c["blender_authorized"] is True
          assert c["object_contract"]["rendered_physical_geometry_count"]==12
          assert c["tuojiao"]["section_mm"]["guang"]==237.1
          assert c["tuojiao"]["section_mm"]["hou"]==153.7
          assert c["tuojiao"]["contact_boundary"]["joinery_cut_count"]==0
          print("MP01B_T3_AUTHORIZATION_PASS")
          PY

      - name: Canonical Tuojiao first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$REVIEW"
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$BUILDER" -- --mode build --contract "$CONTRACT" --asset "$ASSET" --semantic "$SEM" --review-dir "$REVIEW"

      - name: Independent reopen
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background "$ASSET" --python-exit-code 10 --python "$BUILDER" -- --mode inspect --expected "$SEM" --output "$OUT/reopen.json"

      - name: Tuojiao Z-offset mutation 0 to 50
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$BUILDER" -- --mode build --contract "$CONTRACT" --tuojiao-z-offset-mm 50 --asset "$OUT/mutation.blend" --semantic "$OUT/mutation.json"

      - name: Deterministic canonical rebuild
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$BUILDER" -- --mode build --contract "$CONTRACT" --asset "$OUT/rebuild.blend" --semantic "$OUT/rebuild.json"

      - name: Compose Review Board
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATOR" --mode compose-board --canonical "$SEM" --review-dir "$REVIEW" --board "$BOARD"

      - name: Validate T-046
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATOR" --mode validate --contract "$CONTRACT" --canonical "$SEM" --mutation "$OUT/mutation.json" --reopen "$OUT/reopen.json" --rebuild "$OUT/rebuild.json" --asset "$ASSET" --review-dir "$REVIEW" --board "$BOARD" --output "$VAL"
          python - "$VAL" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding="utf-8"))
          assert v["status"]=="PASS"
          print("MP01B_T046_MACHINE_PASS",v["check_count"])
          PY

      - name: Upload T-046 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP01B_T046_TUOJIAO_FIRST_GEOMETRY_V001
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.SEM }}
            ${{ env.BOARD }}
            ${{ env.VAL }}
            ${{ env.REVIEW }}/*.png
