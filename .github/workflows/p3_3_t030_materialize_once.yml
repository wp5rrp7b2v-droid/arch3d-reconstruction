name: T-030 One-time Accepted Artifact Materialization
on:
  pull_request:
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    if: github.event.pull_request.number == 18 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download accepted artifact
        uses: actions/download-artifact@v4
        with:
          name: P3_3_T-030_MASTER_V2_FIRST_ARTICLE_V001
          path: /tmp/t030
          github-token: ${{ github.token }}
          repository: wp5rrp7b2v-droid/arch3d-reconstruction
          run-id: 35977160199
      - name: Verify and materialize exact accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/t030
          echo "199e1dcf7274d732e26e430e80e171f9a2a4d0c55162fb6bb100fe51b681aa91  CMP-FRAME-DAJIAOLIANG-001_MASTER_V001.blend" | sha256sum -c -
          echo "ef69a45735415c618bdfe995181d545e231674b12476af119f92b8d1da610617  CMP-FRAME-DAJIAOLIANG-001_MASTER_SEMANTIC_V001.json" | sha256sum -c -
          echo "8ef4970b6b3b353c5b58a94248a6d978f5ac89e10e03e0ad82ebc9c155911062  CMP-FRAME-DAJIAOLIANG-001_MASTER_VALIDATION_V001.json" | sha256sum -c -
          echo "2398bff3922f3a6373a7160642d787e1b797911c758c558acfc4a92e58679fff  CMP-FRAME-DAJIAOLIANG-001_MASTER_REVIEW_BOARD_V001.png" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          DEST=production/zhenguo_wanfo/component_library/masters/CMP-FRAME-DAJIAOLIANG-001
          cp /tmp/t030/*_SEMANTIC_V001.json "$DEST/"
          cp /tmp/t030/*_VALIDATION_V001.json "$DEST/"
          cp /tmp/t030/*_REVIEW_BOARD_V001.png "$DEST/"
          python scripts/t030_materialize_once.py
          test ! -f "$DEST/CMP-FRAME-DAJIAOLIANG-001_MASTER_V001.blend"
      - name: Commit formalization candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p3_3_t030_materialize_once.yml scripts/t030_materialize_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "T-030 materialize D-128 accepted first article and bind Catalog/V008"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
