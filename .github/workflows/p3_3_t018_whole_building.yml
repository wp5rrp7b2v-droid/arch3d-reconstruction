name: T-018 P3.3 deterministic whole building
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p3_3_t018_whole_building.yml'
      - 'production/zhenguo_wanfo/**'
permissions:
  contents: read
jobs:
  build-validate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and canonical manifest
        run: |
          python3 -m unittest production.zhenguo_wanfo.tests.test_p3_3_whole_building_v001
          python3 production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py
          python3 production/zhenguo_wanfo/scripts/validate_p3_3_whole_building_v001.py
      - name: Install locked Blender 4.5.13
        run: |
          curl --fail --location --show-error --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.5.13-linux-x64/blender --version | head -1 | tee /tmp/BLENDER_VERSION.txt | grep -F 'Blender 4.5.13'
      - name: Canonical build, independent reopen, and four review views
        run: |
          B=/tmp/blender-4.5.13-linux-x64/blender
          $B --background --python-exit-code 10 --python production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py -- --blend /tmp/P3_3_T018_CANONICAL_V001.blend
          $B --background /tmp/P3_3_T018_CANONICAL_V001.blend --python-exit-code 10 --python production/zhenguo_wanfo/scripts/render_p3_3_whole_building_review_v001.py
          sha256sum /tmp/P3_3_T018_CANONICAL_V001.blend > /tmp/P3_3_T018_CANONICAL_V001.sha256
      - name: Mutation and canonical restore
        run: |
          B=/tmp/blender-4.5.13-linux-x64/blender
          $B --background --python-exit-code 10 --python production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py -- --pm005 3605.7 --output /tmp/mutated.json --blend /tmp/mutated.blend
          $B --background --python-exit-code 10 --python production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py -- --output /tmp/restored.json --blend /tmp/restored.blend
          python3 - <<'PY'
          import json
          a=json.load(open('production/zhenguo_wanfo/build/P3_3_WHOLE_BUILDING_RUNTIME_MANIFEST_V001.json'))
          m=json.load(open('/tmp/mutated.json')); r=json.load(open('/tmp/restored.json'))
          assert a['semantic_snapshot_sha256']==r['semantic_snapshot_sha256']
          report={'task':'T-018','parameter':'PM-005','canonical_value_mm':3505.7,'mutated_value_mm':3605.7,'delta_mm':100.0,'source_unchanged':True,'evidence_classification_changed':False,'placement_response':'NO_AUTHORIZED_PLACEMENT_TARGET / OBSERVED_REFERENCE_ONLY','restore_snapshot_match':True,'mutation_does_not_override_reconstructed_design_placement':m['semantic_snapshot_sha256']==a['semantic_snapshot_sha256'],'status':'PASS'}
          open('production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_MUTATION_V001.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          files=list((root/'production/zhenguo_wanfo/review/P3_3_T018').glob('*.png'))
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          evidence={'task':'T-018','version':'V001','github_actions_run_id':os.getenv('GITHUB_RUN_ID'),'run_attempt':os.getenv('GITHUB_RUN_ATTEMPT'),'task_pr_head_sha':os.getenv('GITHUB_SHA'),'blender_version':'4.5.13 linux-x64','artifact_name':'P3_3_T018_HEADLESS_EVIDENCE_V001','review_images':{str(p):digest(p) for p in files},'validation_report_sha256':digest(root/'production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_VALIDATION_V001.json'),'mutation_report_sha256':digest(root/'production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_MUTATION_V001.json'),'local_only_evidence_required':False}
          out=root/'production/zhenguo_wanfo/review/P3_3_T018/P3_3_T018_EVIDENCE_MANIFEST_V001.json';out.write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: P3_3_T018_HEADLESS_EVIDENCE_V001
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/P3_3_T018_CANONICAL_V001.blend
            /tmp/P3_3_T018_CANONICAL_V001.sha256
            /tmp/BLENDER_VERSION.txt
            /tmp/mutated.json
            /tmp/restored.json
            production/zhenguo_wanfo/build/P3_3_WHOLE_BUILDING_RUNTIME_MANIFEST_V001.json
            production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_*.json
            production/zhenguo_wanfo/review/P3_3_T018/*.png
            production/zhenguo_wanfo/review/P3_3_T018/P3_3_T018_EVIDENCE_MANIFEST_V001.json
