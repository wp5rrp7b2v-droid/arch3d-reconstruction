name: T-018 P3.3 Deterministic Whole Building

on:
  pull_request:
    paths:
      - '.github/workflows/p3_3_t018_whole_building.yml'
      - 'production/zhenguo_wanfo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER: /tmp/blender-4.5.13-linux-x64/blender
      SCRIPT_DIR: production/zhenguo_wanfo/scripts
      ARTIFACT_DIR: artifacts/t018
      REVIEW_DIR: production/zhenguo_wanfo/review/P3_3_T018
    steps:
      - uses: actions/checkout@v4
      - name: Non-Blender contract tests
        run: python -m unittest production/zhenguo_wanfo/tests/test_p3_3_whole_building_v001.py
      - name: Install and pin Blender 4.5.13 linux-x64
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          "$BLENDER" --version | tee /tmp/blender-version.txt
          grep -Fx 'Blender 4.5.13' /tmp/blender-version.txt
      - name: Run A — clean canonical build and save
        run: |
          mkdir -p "$ARTIFACT_DIR" "$REVIEW_DIR"
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$SCRIPT_DIR/build_p3_3_whole_building_v001.py" -- --blend "$ARTIFACT_DIR/P3_3_WHOLE_BUILDING_CANONICAL_V001.blend" --manifest "$ARTIFACT_DIR/run_a_manifest.json" --snapshot "$ARTIFACT_DIR/run_a_snapshot.json"
      - name: Run B — independent reopen and machine validation
        run: |
          "$BLENDER" --background "$ARTIFACT_DIR/P3_3_WHOLE_BUILDING_CANONICAL_V001.blend" --python-exit-code 10 --python "$SCRIPT_DIR/validate_p3_3_whole_building_v001.py" -- --manifest "$ARTIFACT_DIR/run_a_manifest.json" --output "$ARTIFACT_DIR/run_b_reopen_validation.json" --compare "$ARTIFACT_DIR/run_a_snapshot.json"
      - name: Fixed scripted review rendering
        run: |
          "$BLENDER" --background "$ARTIFACT_DIR/P3_3_WHOLE_BUILDING_CANONICAL_V001.blend" --python-exit-code 10 --python "$SCRIPT_DIR/render_p3_3_whole_building_review_v001.py" -- --manifest "$ARTIFACT_DIR/run_a_manifest.json" --output-dir "$REVIEW_DIR"
      - name: Run C — PM-005 test-only mutation build and validation
        run: |
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$SCRIPT_DIR/build_p3_3_whole_building_v001.py" -- --pm005 3605.7 --blend "$ARTIFACT_DIR/run_c_mutation.blend" --manifest "$ARTIFACT_DIR/run_c_manifest.json" --snapshot "$ARTIFACT_DIR/run_c_snapshot.json"
          "$BLENDER" --background "$ARTIFACT_DIR/run_c_mutation.blend" --python-exit-code 10 --python "$SCRIPT_DIR/validate_p3_3_whole_building_v001.py" -- --manifest "$ARTIFACT_DIR/run_c_manifest.json" --output "$ARTIFACT_DIR/run_c_validation.json" --mode mutation
      - name: Run D — discard mutation and clean canonical restore
        run: |
          rm -f "$ARTIFACT_DIR/run_c_mutation.blend"
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$SCRIPT_DIR/build_p3_3_whole_building_v001.py" -- --blend "$ARTIFACT_DIR/run_d_restore.blend" --manifest "$ARTIFACT_DIR/run_d_manifest.json" --snapshot "$ARTIFACT_DIR/run_d_snapshot.json"
          "$BLENDER" --background "$ARTIFACT_DIR/run_d_restore.blend" --python-exit-code 10 --python "$SCRIPT_DIR/validate_p3_3_whole_building_v001.py" -- --manifest "$ARTIFACT_DIR/run_d_manifest.json" --output "$ARTIFACT_DIR/run_d_validation.json" --mode restore --compare "$ARTIFACT_DIR/run_a_snapshot.json"
          cmp "$ARTIFACT_DIR/run_a_snapshot.json" "$ARTIFACT_DIR/run_d_snapshot.json"
      - name: Persistent hashes and evidence manifest
        run: |
          cp /tmp/blender-version.txt "$ARTIFACT_DIR/"
          sha256sum "$ARTIFACT_DIR/P3_3_WHOLE_BUILDING_CANONICAL_V001.blend" "$REVIEW_DIR"/*.png > "$ARTIFACT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.'); out=pathlib.Path(os.environ['ARTIFACT_DIR']); review=pathlib.Path(os.environ['REVIEW_DIR'])
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          data={'version':'V001','task':'T-018','status':'ACTIONS_EVIDENCE','github_actions_run_id':os.getenv('GITHUB_RUN_ID'),'run_attempt':os.getenv('GITHUB_RUN_ATTEMPT'),'head_sha':os.getenv('GITHUB_SHA'),'blender_version':'4.5.13','artifact_name':'P3_3_T018_HEADLESS_EVIDENCE_V001','artifact_id':'AVAILABLE_AFTER_UPLOAD','canonical_blend_sha256':digest(out/'P3_3_WHOLE_BUILDING_CANONICAL_V001.blend'),'review_images':{p.name:digest(p) for p in sorted(review.glob('*.png'))},'local_mac_required':'NO_FOR_SCRIPTED_T018_CHAIN; FINAL_GATE_REVIEW_OUT_OF_SCOPE'}
          (out/'P3_3_T018_EVIDENCE_MANIFEST_V001.json').write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload formal evidence
        uses: actions/upload-artifact@v4
        with:
          name: P3_3_T018_HEADLESS_EVIDENCE_V001
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/t018/**
            production/zhenguo_wanfo/review/P3_3_T018/*.png
