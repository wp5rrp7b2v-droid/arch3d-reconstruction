name: T-041 Post-Formalization Verification

on:
  push:
    branches: [ codex/t041-p3-3-ang-master-v2-v001 ]
    paths:
      - '.github/workflows/p3_3_t041_post_formalization.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      BRANCH_NAME: codex/t041-p3-3-ang-master-v2-v001
      REGISTRY: docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json
      REGISTRY_V008: docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_V008.json
      DERIVED: docs/evidence/zhenguo_wanfo/derived
      DEF: production/zhenguo_wanfo/component_library/masters/CMP-GONG-ANG-001/CMP-GONG-ANG-001_ANG_DEFINITION_V001.json
      WRAPPER: production/zhenguo_wanfo/component_library/masters/CMP-GONG-ANG-001/build_ang_master_v001.py
      VALIDATOR: production/zhenguo_wanfo/scripts/validate_t041_ang.py
      GATE_A: production/zhenguo_wanfo/registry/P3_3_STAGE1_ANG_LENGTH_SLOPE_ASSEMBLY_CONTROL_SET_V001.json
      GATE_B: production/zhenguo_wanfo/registry/P3_3_STAGE1_ANG_LONGITUDINAL_PROFILE_CONTROL_SET_V001.json
      OUT: artifacts/t041_post
      REVIEW: artifacts/t041_post/review
      ASSET: artifacts/t041_post/regression.blend
      SEM: artifacts/t041_post/regression_semantic.json
      BOARD: artifacts/t041_post/regression_review_board.png
      VAL: artifacts/t041_post/regression_validation.json
      ACCEPTED_BLEND: 7a8c2bcdde1fac1f9f7f06bd7c1894237a7bda02a2a38e2b329da4f4b719d0a8
      ACCEPTED_FAMILY_SIG: a8c3b3757d6f2defd88bcece3fe754979a2c02af4e0de59f3ecc94e9fb6d7a29
      ACCEPTED_TOU_SIG: 61a2bbb85fa5fc07ed9c37ce610f2aee0360f280c09f8317614b7a62f7819250
      ACCEPTED_ER_SIG: b778edc208d788c5f9fad0a19849ca33f3334e7c4e2656721279386528979678
      ACCEPTED_GATE_A_SIG: 6c9b8c5b6ee6715292df5b23b7d8b8d9fdaaf4be7d1558631fea5883528b7096
      ACCEPTED_GATE_B_SIG: dc38ab72be1f5aef3192a48e11621a3288c422475545b56dc5e29fa0102e2ae5
      ACCEPTED_TOU_PROFILE_SIG: 3e45e7732cf49012cbf8b5e480e76ad2fd986c4aa717dd650e3bf3f9831f7bb5
      ACCEPTED_ER_PROFILE_SIG: c4b935c9d445414831f16d949b02ff110f3e336f88c68dd68f58d514bd172778

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Precheck D-258 branch truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$REVIEW"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("docs/project_control/project_state.json").read_text(encoding="utf-8"))
          v8=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_V008.json").read_text(encoding="utf-8"))
          cur=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json").read_text(encoding="utf-8"))
          cat=json.loads(Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json").read_text(encoding="utf-8"))
          assert v8==cur
          assert cat["approved_master_count"]==25
          p=v8["stage1_master_progress_summary"]
          assert p["approved_master_count"]==25
          assert p["pending_master_object_type_count"]==3
          assert abs(float(p["master_completion_percent"])-89.3)<1e-9
          assert p["master_covered_registry_record_count"]==363
          tou=[x for x in v8["items"] if x.get("component")=="头昂"]
          er=[x for x in v8["items"] if x.get("component")=="二昂"]
          assert len(tou)==16 and len(er)==16
          assert all(x.get("count_status")=="LOCKED_DERIVED" for x in tou+er)
          assert all(x.get("master_coverage_status")=="APPROVED_MASTER_AVAILABLE" for x in tou+er)
          assert all(x.get("master_reference")=="CMP-GONG-ANG-001_MASTER" for x in tou+er)
          assert all(x.get("master_variant")=="TOU_ANG" for x in tou)
          assert all(x.get("master_variant")=="ER_ANG" for x in er)
          assert all(x.get("historical_standalone_full_length_status")=="UNRESOLVED" for x in tou+er)
          assert all(x.get("reference_control_span_applies_to_instance") is False for x in tou+er)
          t=s["p3_3"]["t041"]
          assert t["formalization_complete"] is True
          assert t["formalization_result_decision_id"]=="D-257"
          assert t["post_formalization_authority"]=="D-258"
          assert t["post_formalization_verification_authorized"] is True
          assert t["derived_excel_sync_authorized"] is True
          assert t["ready_merge_authorized"] is False
          assert t["merge_authorized"] is False
          print("T041_D258_PRECHECK_PASS")
          PY
          echo "PRE_EXCEL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "REGISTRY_SOURCE_COMMIT=$(git log -1 --format=%H -- "$REGISTRY")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel dependencies
        run: python -m pip install --disable-pip-version-check "openpyxl==3.1.5" pillow

      - name: Generate Derived Excel
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_wanfo_component_registry_excel.py --input "$REGISTRY" --output-dir "$DERIVED" --source-commit "$REGISTRY_SOURCE_COMMIT"

      - name: Validate Derived Excel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from openpyxl import load_workbook
          root=Path("docs/evidence/zhenguo_wanfo/derived")
          m=json.loads((root/"P3_WANFO_COMPONENT_EXCEL_SYNC_MANIFEST.json").read_text(encoding="utf-8"))
          assert m["status"]=="SYNCED" and m["canonical_truth"]=="JSON" and m["excel_role"]=="DERIVED_VIEW"
          assert m["record_count"]==505
          current=Path(m["current_excel"]); versioned=Path(m["versioned_excel"])
          assert current.exists() and versioned.exists()
          csha=hashlib.sha256(current.read_bytes()).hexdigest(); vsha=hashlib.sha256(versioned.read_bytes()).hexdigest()
          assert csha==m["current_excel_sha256"] and vsha==m["versioned_excel_sha256"]
          reg=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json").read_text(encoding="utf-8"))
          p=reg["stage1_master_progress_summary"]
          assert p["approved_master_count"]==25
          assert p["master_covered_registry_record_count"]==363
          wb=load_workbook(current,read_only=True,data_only=False)
          assert set(wb.sheetnames)=={"进度总览","实例登记","统计摘要","版本与来源","使用规则"}
          assert wb["实例登记"].max_row-1==505
          assert wb["进度总览"]["B4"].value==505
          assert wb["进度总览"]["B7"].value==25
          wb.close()
          Path("artifacts/t041_post/excel_summary.json").write_text(json.dumps({
            "status":"PASS","source_commit":m["source_commit"],"current_excel":str(current),"versioned_excel":str(versioned),
            "current_excel_sha256":csha,"versioned_excel_sha256":vsha,
            "record_count":505,"approved_master_count":25,"master_covered_registry_record_count":363
          },indent=2)+"\n",encoding="utf-8")
          print("T041_DERIVED_EXCEL_PASS",csha,vsha,m["source_commit"])
          PY

      - name: Commit Derived Excel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- "$DERIVED")" ]; then
            git add "$DERIVED"
            git diff --cached --check
            git commit -m "derived: sync Wanfo component registry Excel for T-041"
            git push origin "HEAD:$BRANCH_NAME"
          fi
          echo "REGRESSION_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 fonts-noto-cjk
          curl --fail --location --show-error --retry 3 --user-agent "Mozilla/5.0 GitHubActions T041Post" -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.5.13-linux-x64/blender --version | grep -Eq '^Blender 4\.5\.13( LTS)?$'

      - name: Prepare latest-head T-041 Definition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("production/zhenguo_wanfo/component_library/masters/CMP-GONG-ANG-001/CMP-GONG-ANG-001_ANG_DEFINITION_V001.json")
          d=json.loads(src.read_text(encoding="utf-8"))
          assert d["status"].startswith("FORMALIZED + CATALOG/V008/CURRENT BOUND / D-257")
          ex=d["execution_boundary"]
          assert ex["formalization_complete"] is True and ex["catalog_v008_binding_complete"] is True
          assert ex["merge_authorized"] is False and ex["closure_authorized"] is False
          assert d["gate_a_contract"]["semantic_signature_sha256"]=="6c9b8c5b6ee6715292df5b23b7d8b8d9fdaaf4be7d1558631fea5883528b7096"
          assert d["gate_b_contract"]["family_semantic_control_sha256"]=="dc38ab72be1f5aef3192a48e11621a3288c422475545b56dc5e29fa0102e2ae5"
          Path("/tmp/t041_regression_definition.json").write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("T041_REGRESSION_DEFINITION_PASS")
          PY

      - name: Latest-head T-041 rebuild and reopen
        shell: bash
        env:
          BLENDER: /tmp/blender-4.5.13-linux-x64/blender
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$WRAPPER" -- --mode build --definition /tmp/t041_regression_definition.json --asset "$ASSET" --semantic "$SEM" --review-dir "$REVIEW"
          "$BLENDER" --background "$ASSET" --python-exit-code 10 --python "$WRAPPER" -- --mode inspect --asset "$ASSET" --expected "$SEM" --output "$OUT/reopen.json"
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$WRAPPER" -- --mode build --definition /tmp/t041_regression_definition.json --asset "$OUT/restore.blend" --semantic "$OUT/restore.json"
          python "$VALIDATOR" --mode compose-board --definition /tmp/t041_regression_definition.json --canonical "$SEM" --review-dir "$REVIEW" --board "$BOARD"
          python "$VALIDATOR" --mode validate --definition /tmp/t041_regression_definition.json --canonical "$SEM" --reopen "$OUT/reopen.json" --restore "$OUT/restore.json" --registry "$REGISTRY" --gate-a "$GATE_A" --gate-b "$GATE_B" --asset "$ASSET" --review-dir "$REVIEW" --board "$BOARD" --output "$VAL"

      - name: Assert T-041 accepted geometry match
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          v=json.loads(Path("artifacts/t041_post/regression_validation.json").read_text(encoding="utf-8"))
          s=json.loads(Path("artifacts/t041_post/regression_semantic.json").read_text(encoding="utf-8"))
          assert v["status"]=="PASS" and v["check_count"]==90
          assert v["family_semantic_signature"]==os.environ["ACCEPTED_FAMILY_SIG"]
          assert v["geometry_signatures"]["TOU_ANG"]==os.environ["ACCEPTED_TOU_SIG"]
          assert v["geometry_signatures"]["ER_ANG"]==os.environ["ACCEPTED_ER_SIG"]
          assert v["gate_a_signature"]==os.environ["ACCEPTED_GATE_A_SIG"]
          assert v["gate_b_family_signature"]==os.environ["ACCEPTED_GATE_B_SIG"]
          assert v["tou_profile_signature"]==os.environ["ACCEPTED_TOU_PROFILE_SIG"]
          assert v["er_profile_signature"]==os.environ["ACCEPTED_ER_PROFILE_SIG"]
          assert abs(float(v["fixture"]["run_mm"])-719.1)<1e-9
          assert abs(float(v["fixture"]["observed_projection_mm"])-719.5)<1e-9
          assert abs(float(v["fixture"]["delta_mm"])-0.4)<1e-9
          regen=hashlib.sha256(Path("artifacts/t041_post/regression.blend").read_bytes()).hexdigest()
          Path("artifacts/t041_post/t041_regression_summary.json").write_text(json.dumps({
            "status":"PASS","check_count":90,"regression_head":os.environ["REGRESSION_HEAD"],
            "family_semantic_signature":v["family_semantic_signature"],"geometry_signatures":v["geometry_signatures"],
            "gate_a_signature":v["gate_a_signature"],"gate_b_family_signature":v["gate_b_family_signature"],
            "tou_profile_signature":v["tou_profile_signature"],"er_profile_signature":v["er_profile_signature"],
            "fixture":v["fixture"],"regenerated_blend_sha256":regen,
            "regenerated_blend_promoted_to_canonical":False,"accepted_canonical_blend_sha256":os.environ["ACCEPTED_BLEND"],
            "accepted_geometry_match":True
          },indent=2)+"\n",encoding="utf-8")
          print("T041_LATEST_HEAD_REGRESSION_PASS",regen)
          PY

      - name: Assert dedicated route ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          txt=Path(".github/workflows/p3_3_master_v2.yml").read_text(encoding="utf-8")
          assert "codex/t041-p3-3-ang-master-v2-v001" in txt
          assert Path(".github/workflows/p3_3_t041_ang_master.yml").exists()
          assert Path(".github/workflows/p3_3_t041_ang_formalize.yml").exists()
          print("T041_DEDICATED_ROUTE_OWNERSHIP_PASS")
          PY

      - name: Dispatch shared regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflows=(
            p3_3_t021_four_chuanfu_master.yml
            p3_3_t022_pingliang_master.yml
            p3_3_t023_dingfu_master.yml
            p3_3_t024_rufu_master.yml
            p3_3_t037_guazi_gong_master.yml
            p3_3_t038_mangong_master.yml
            p3_3_t039_linggong_master.yml
            p3_3_t040_huagong_master.yml
          )
          for wf in "${workflows[@]}"; do gh workflow run "$wf" --ref "$BRANCH_NAME"; done
          printf '%s\n' "${workflows[@]}" > "$OUT/shared_workflows.txt"

      - name: Wait for shared regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          workflows=[x.strip() for x in open("artifacts/t041_post/shared_workflows.txt") if x.strip()]
          branch=os.environ["BRANCH_NAME"]; head=os.environ["REGRESSION_HEAD"]; results={}; deadline=time.time()+4200
          while time.time()<deadline:
              all_done=True
              for wf in workflows:
                  if wf in results and results[wf].get("status")=="completed": continue
                  cp=subprocess.run(["gh","run","list","--workflow",wf,"--branch",branch,"--event","workflow_dispatch","--limit","10","--json","databaseId,status,conclusion,headSha,createdAt,url"],capture_output=True,text=True,check=True,env={**os.environ,"GH_TOKEN":os.environ["GH_TOKEN"]})
                  arr=json.loads(cp.stdout or "[]"); matches=[r for r in arr if r.get("headSha")==head]
                  if not matches: all_done=False; continue
                  results[wf]=matches[0]
                  if matches[0].get("status")!="completed": all_done=False
              if all_done and len(results)==len(workflows): break
              time.sleep(15)
          if len(results)!=len(workflows): raise SystemExit("SHARED_REGRESSION_RUN_NOT_FOUND "+json.dumps(results))
          bad={k:v for k,v in results.items() if v.get("conclusion")!="success"}
          if bad: raise SystemExit("SHARED_REGRESSION_FAIL "+json.dumps(bad))
          with open("artifacts/t041_post/shared_regression_runs.json","w",encoding="utf-8") as f:
              json.dump({"status":"PASS","regression_head":head,"runs":results},f,indent=2); f.write("\n")
          print("T041_SHARED_REGRESSIONS_PASS",json.dumps({k:v["databaseId"] for k,v in results.items()}))
          PY

      - name: Final readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          reg=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json").read_text(encoding="utf-8"))
          v8=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_V008.json").read_text(encoding="utf-8"))
          cat=json.loads(Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json").read_text(encoding="utf-8"))
          state=json.loads(Path("docs/project_control/project_state.json").read_text(encoding="utf-8"))
          excel=json.loads(Path("artifacts/t041_post/excel_summary.json").read_text(encoding="utf-8"))
          t041=json.loads(Path("artifacts/t041_post/t041_regression_summary.json").read_text(encoding="utf-8"))
          shared=json.loads(Path("artifacts/t041_post/shared_regression_runs.json").read_text(encoding="utf-8"))
          assert reg==v8 and cat["approved_master_count"]==25
          p=reg["stage1_master_progress_summary"]
          assert p["approved_master_count"]==25
          assert p["master_covered_registry_record_count"]==363
          assert excel["approved_master_count"]==25 and excel["master_covered_registry_record_count"]==363
          assert t041["status"]=="PASS" and t041["check_count"]==90 and t041["accepted_geometry_match"] is True
          assert shared["status"]=="PASS"
          t=state["p3_3"]["t041"]
          assert t["post_formalization_authority"]=="D-258"
          assert t["ready_merge_authorized"] is False and t["merge_authorized"] is False
          generic=Path(".github/workflows/p3_3_master_v2.yml").read_text(encoding="utf-8")
          assert "codex/t041-p3-3-ang-master-v2-v001" in generic
          target=[x for x in reg["items"] if x.get("component") in ("头昂","二昂")]
          assert len(target)==32
          assert all(x.get("count_status")=="LOCKED_DERIVED" for x in target)
          assert all(x.get("historical_standalone_full_length_status")=="UNRESOLVED" for x in target)
          assert all(x.get("reference_control_span_applies_to_instance") is False for x in target)
          summary={
            "status":"READY_FOR_PRODUCT_OWNER_READY_MERGE_DECISION","authority":"D-258",
            "source_registry_commit":os.environ["REGISTRY_SOURCE_COMMIT"],"verification_head":os.environ["REGRESSION_HEAD"],
            "catalog_approved_master_count":25,"master_completion_percent":89.3,"master_covered_registry_record_count":363,
            "current_equals_v008":True,"excel":excel,"t041_latest_head_regression":t041,"shared_regressions":shared,
            "generic_p3_3_master_v2":"SKIPPED_AS_INTENDED / dedicated T-041 route authoritative",
            "ang_binding_boundary":"32 LOCKED_DERIVED / not direct historical whole-hall count / historical full lengths UNRESOLVED",
            "pr_number":37,"pr_must_remain_draft":True,"ready_transition_authorized":False,"merge_authorized":False,"closure_authorized":False
          }
          Path("artifacts/t041_post/post_formalization_readiness_evidence.json").write_text(json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          print("T041_POST_FORMALIZATION_EVIDENCE_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: P3_3_T041_POST_FORMALIZATION_VERIFICATION_V001
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.OUT }}/excel_summary.json
            ${{ env.OUT }}/t041_regression_summary.json
            ${{ env.OUT }}/regression_validation.json
            ${{ env.OUT }}/regression_semantic.json
            ${{ env.OUT }}/regression_review_board.png
            ${{ env.OUT }}/shared_regression_runs.json
            ${{ env.OUT }}/post_formalization_readiness_evidence.json
