name: T-021 Materialize Formal Review PNGs

on:
  pull_request:
    paths:
      - '.github/workflows/t021_materialize_review_pngs.yml'

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: '35440785415'
      ARTIFACT_NAME: P3_3_T021_FOUR_CHUANFU_FIRST_ARTICLE_V001
      TARGET_DIR: production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download accepted Run #3 artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/t021-artifact
          mkdir -p /tmp/t021-artifact
          gh run download "$SOURCE_RUN_ID" -n "$ARTIFACT_NAME" -D /tmp/t021-artifact
          test -f /tmp/t021-artifact/production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/FRONT.png
          test -f /tmp/t021-artifact/artifacts/t021/canonical_semantic.json
          echo "ARTIFACT_DOWNLOAD_PASS"

      - name: Verify accepted artifact hashes
        run: |
          set -euo pipefail
          cd /tmp/t021-artifact
          echo 'f451148a35cf1ae1014ad798a67a7be91c68c4346cc0855a66a31822ba375c2b  production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/FRONT.png' | sha256sum -c -
          echo 'ef1ae5a286d0b8bfde95f380472a412024fdffd42792739b9e877e81b2a50d79  production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/SIDE.png' | sha256sum -c -
          echo '5af70a95f0f87664df3d7e19448f27b54d340d1fb6ed30a6d8841089ed25b997  production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/TOP.png' | sha256sum -c -
          echo 'a7466623bea4816f4561afb53ae27acc10c94182bfd969a3b27d548157ce9a85  production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/AXON.png' | sha256sum -c -
          echo 'b6b886f9ddcc50e73f8425e3083088f770d643571d57d521ed3b29872eaaf7cb  production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/DIMENSION_PARAMETER_SUMMARY.png' | sha256sum -c -
          echo '03a8526b6570692140e986f31eb7651c483f7b42693209977e29e9dc89f9f953  production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-FOUR-CHUANFU-001/EVIDENCE_UNCERTAINTY_SUMMARY.png' | sha256sum -c -
          echo "REVIEW_HASHES_PASS"

      - name: Cross-check tracked formal text records against artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          repo=pathlib.Path('.')
          art=pathlib.Path('/tmp/t021-artifact/artifacts/t021')
          pairs=[
            (repo/'production/zhenguo_wanfo/component_library/masters/CMP-FRAME-FOUR-CHUANFU-001/CMP-FRAME-FOUR-CHUANFU-001_MASTER_SEMANTIC_V001.json', art/'canonical_semantic.json'),
            (repo/'production/zhenguo_wanfo/validation/CMP-FRAME-FOUR-CHUANFU-001_MASTER_VALIDATION_V001.json', art/'CMP-FRAME-FOUR-CHUANFU-001_MASTER_VALIDATION_V001.json'),
            (repo/'production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json', art/'P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json'),
          ]
          for tracked, source in pairs:
              assert json.loads(tracked.read_text(encoding='utf-8')) == json.loads(source.read_text(encoding='utf-8')), tracked
          tracked=repo/'docs/production/zhenguo_wanfo/P3_3_T021_FOUR_CHUANFU_ENGINEERING_REVIEW_V001.md'
          source=art/'P3_3_T021_FOUR_CHUANFU_ENGINEERING_REVIEW_V001.md'
          assert tracked.read_text(encoding='utf-8') == source.read_text(encoding='utf-8')
          print('FORMAL_TEXT_RECORDS_MATCH_ARTIFACT')
          PY

      - name: Materialize six accepted review PNGs
        run: |
          set -euo pipefail
          src="/tmp/t021-artifact/$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          cp -p "$src/FRONT.png" "$TARGET_DIR/FRONT.png"
          cp -p "$src/SIDE.png" "$TARGET_DIR/SIDE.png"
          cp -p "$src/TOP.png" "$TARGET_DIR/TOP.png"
          cp -p "$src/AXON.png" "$TARGET_DIR/AXON.png"
          cp -p "$src/DIMENSION_PARAMETER_SUMMARY.png" "$TARGET_DIR/DIMENSION_PARAMETER_SUMMARY.png"
          cp -p "$src/EVIDENCE_UNCERTAINTY_SUMMARY.png" "$TARGET_DIR/EVIDENCE_UNCERTAINTY_SUMMARY.png"

      - name: Verify no binary Master is staged
        run: |
          set -euo pipefail
          if find production -type f \( -name '*.blend' -o -name '*.blend1' \) | grep -q .; then
            echo "Unexpected Blender binary under production/"
            exit 1
          fi
          git status --short
          test "$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 6
          echo "NO_BLEND_PUBLICATION_PASS"

      - name: Commit exact accepted review PNG bytes to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_DIR"
          git commit -m "T-021: materialize formal review PNGs from accepted Run 35440785415"
          git push origin "HEAD:$HEAD_BRANCH"
