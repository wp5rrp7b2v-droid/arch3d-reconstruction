name: Wanfo component form actual Chrome QA
on:
  push:
    branches: [evidence/component-form-reference-v001]
    paths:
      - docs/component_form_reference_v001/index.html
      - docs/component_form_reference_v001/pages/**
      - docs/component_form_reference_v001/style.css
      - docs/component_form_reference_v001/app.js
      - docs/component_form_reference_v001/tools/browser_qa.py
      - docs/component_form_reference_v001/tools/validate.py
      - .github/workflows/wanfo_component_form_qa.yml
permissions:
  contents: write
concurrency:
  group: wanfo-component-form-v001-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare actual Google Chrome and CJK fonts
        run: |
          python -m pip install pillow playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          google-chrome --version
      - run: python docs/component_form_reference_v001/tools/validate.py
      - run: python docs/component_form_reference_v001/tools/browser_qa.py
      - name: Archive QA on this evidence branch only
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = evidence/component-form-reference-v001
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/component_form_reference_v001/qa
          git diff --cached --quiet || git commit -m "保存16页真实Chrome浏览、截图及自动验证结果"
          git push origin HEAD:evidence/component-form-reference-v001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WANFO_COMPONENT_FORM_CHROME_QA
          path: docs/component_form_reference_v001/qa
          retention-days: 90
