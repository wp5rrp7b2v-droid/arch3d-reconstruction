name: Wanfo Component Registry Excel Sync

on:
  push:
    branches:
      - source/src-zg-wf-001-lfs
    paths:
      - '.github/workflows/wanfo-component-registry-excel.yml'

permissions:
  contents: write

jobs:
  extract-dajiao-a1-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract candidate pages
        shell: bash
        run: |
          set -euo pipefail
          PDF="$(find docs/evidence/zhenguo_wanfo/source_primary -maxdepth 1 -name 'SRC-ZG-WF-001_*.pdf' -print -quit)"
          test -n "$PDF"
          mkdir -p tmp/dajiao_a1
          sha256sum "$PDF" | tee tmp/dajiao_a1/pdf_sha256.txt
          pdfinfo "$PDF" > tmp/dajiao_a1/pdfinfo.txt
          pdftotext -f 96 -l 108 -layout "$PDF" tmp/dajiao_a1/pages_096_108.txt
          grep -n -C 20 -E '大角梁|子角梁|仔角梁|隐角梁|角梁|表[[:space:]]*2[-－]50|225|200[.]5|216[.]5|152' tmp/dajiao_a1/pages_096_108.txt > tmp/dajiao_a1/keyword_hits.txt || true
          for p in 99 100 101 102 103 104 105; do
            pdftoppm -f "$p" -singlefile -png -r 120 "$PDF" "tmp/dajiao_a1/page_${p}"
          done

      - name: Commit temporary evidence extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/dajiao_a1
          git commit -m "temp: extract dajiao A1 evidence pages"
          git push origin HEAD:source/src-zg-wf-001-lfs
