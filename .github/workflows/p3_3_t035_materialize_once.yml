name: T035 Materialize Accepted Artifact

on:
  push:
    branches:
      - codex/t035-p3-3-youe-master-v2-v001
    paths:
      - .github/workflows/p3_3_t035_materialize_once.yml
      - scripts/t035_materialize_once.py

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout T-035 branch
        uses: actions/checkout@v4
        with:
          ref: codex/t035-p3-3-youe-master-v2-v001
          fetch-depth: 0

      - name: Download accepted artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          curl --fail --location --show-error
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10903011230/zip"
          -o /tmp/t035_accepted.zip

      - name: Materialize and validate
        run: python scripts/t035_materialize_once.py /tmp/t035_accepted.zip

      - name: Assert canonical blend is not tracked
        run: |
          test -z "$(git ls-files -- 'production/zhenguo_wanfo/component_library/masters/CMP-FRAME-YOUE-001/*.blend')"

      - name: Commit formalization
        run: |
          rm -f .github/workflows/p3_3_t035_materialize_once.yml
          rm -f scripts/t035_materialize_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "T-035: formalize accepted 由额 Master"
          git push origin HEAD:codex/t035-p3-3-youe-master-v2-v001
