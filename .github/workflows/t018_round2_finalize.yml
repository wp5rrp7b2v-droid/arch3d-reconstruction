name: TEMP T-018 Round 2 Finalize Canonical Outputs

on:
  push:
    branches:
      - codex/t-018
    paths:
      - '.github/workflows/t018_round2_finalize.yml'

permissions:
  contents: write

jobs:
  finalize-round2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/t-018
          fetch-depth: 0

      - name: Verify exact reviewed Round 2 implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/p3_3_t018_whole_building.yml)" = "4963efb1063d5b193ca9b882ae20c7a399721e70"
          test "$(git hash-object production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py)" = "557a859ed02d37ea08816c31d7628612296ec06c"
          test "$(git hash-object production/zhenguo_wanfo/scripts/p3_3_whole_building_common_v001.py)" = "9581226368a8649ee337371f09770f391913c6c3"
          test "$(git hash-object production/zhenguo_wanfo/scripts/render_p3_3_whole_building_review_v001.py)" = "a0b1bfaeb5c8ee8aa36d41e2986b8db9144c87d9"
          test "$(git hash-object production/zhenguo_wanfo/scripts/validate_p3_3_whole_building_v001.py)" = "e03f908d18f546e3023fdc3684bfb211d7a43be7"
          test "$(git hash-object production/zhenguo_wanfo/tests/test_p3_3_whole_building_v001.py)" = "6ee1080fdc6d1aa111f0ace0c0ceeffe5aef3a95"

      - name: Run Round 2 regression and regenerate canonical JSON outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest production/zhenguo_wanfo/tests/test_p3_3_whole_building_v001.py production/zhenguo_wanfo/tests/test_p3_3_building_graph_v001.py production/zhenguo_wanfo/tests/test_p2_2_structural_skeleton_v001.py
          python -m compileall -q production/zhenguo_wanfo/scripts production/zhenguo_wanfo/tests
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/p3_3_t018_whole_building.yml')"
          python production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py --manifest-only
          python production/zhenguo_wanfo/scripts/validate_p3_3_whole_building_v001.py --manifest production/zhenguo_wanfo/build/P3_3_WHOLE_BUILDING_RUNTIME_MANIFEST_V001.json --output production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_VALIDATION_V001.json
          python production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py --pm005 3605.7 --manifest /tmp/P3_3_T018_MUTATION_MANIFEST.json --manifest-only
          python production/zhenguo_wanfo/scripts/validate_p3_3_whole_building_v001.py --manifest /tmp/P3_3_T018_MUTATION_MANIFEST.json --output production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_MUTATION_V001.json --mode mutation
          python - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path('production/zhenguo_wanfo/build/P3_3_WHOLE_BUILDING_RUNTIME_MANIFEST_V001.json').read_text(encoding='utf-8'))
          counts=runtime['runtime_accounting']['outcome_counts']
          evidence={
            'artifact_id': None,
            'artifact_name': 'P3_3_T018_HEADLESS_EVIDENCE_V001',
            'blender_version': '4.5.13 linux-x64 (workflow pinned; pending current-head Actions execution)',
            'canonical_blend_sha256': None,
            'canonical_semantic_snapshot_sha256': runtime['canonical_semantic_snapshot_sha256'],
            'claim_boundary': 'No current-head Actions PASS, Blender artifact, or PNG is claimed before an actual workflow run.',
            'expected_review_representation_counts': {
              'control_visible_represented_count': counts.get('GENERATED_CONTROL',0),
              'deferred_marker_count': counts.get('DEFERRED',0),
              'envelope_visible_count': counts.get('GENERATED_ENVELOPE',0),
              'formal_visible_count': counts.get('GENERATED_FORMAL_GEOMETRY',0),
              'proxy_visible_represented_count': counts.get('GENERATED_PROXY',0),
              'unknown_marker_count': counts.get('UNKNOWN_BLOCKED',0),
            },
            'github_actions_run_id': None,
            'head_sha': None,
            'local_mac_required': 'FINAL_GATE_REVIEW_OUT_OF_SCOPE; SCRIPTED_T018_CHAIN_USES_GITHUB_ACTIONS',
            'pr_head_sha': None,
            'review_images': {},
            'run_attempt': None,
            'status': 'PENDING_GITHUB_ACTIONS',
            'task': 'T-018',
            'version': 'V001',
            'workflow_checkout_sha': None,
          }
          p=Path('production/zhenguo_wanfo/review/P3_3_T018/P3_3_T018_EVIDENCE_MANIFEST_V001.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git diff --check
          test -z "$(git diff --name-only | grep '^docs/project_control/' || true)"

      - name: Commit generated outputs and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/t018_round2_finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^docs/project_control/' || true)"
          git commit -m 'T-018: finalize Round 2 canonical outputs'
          git push origin HEAD:codex/t-018
