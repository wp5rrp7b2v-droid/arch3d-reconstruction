name: MP-01B T-047 Circle 1 Targeted Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/mp01b_t047_circle1_targeted_build.yml'
      - 'docs/tasks/T-047_MP01B_CIRCLE1_TARGETED_BUILD_V001.md'
      - 'production/zhenguo_wanfo/assembly/MP01B_CIRCLE1_TARGETED_BUILD_PREPARATION_V001.json'
      - 'production/zhenguo_wanfo/assembly/MP01B_CIRCLE1_INTERIOR_HUAGONG_VISIBLE_PROFILE_RESOLUTION_V001.json'
      - 'production/zhenguo_wanfo/scripts/mp01b_circle1_targeted_build_v001.py'
      - 'production/zhenguo_wanfo/scripts/validate_mp01b_circle1_targeted_build_v001.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER: /tmp/blender-4.5.13-linux-x64/blender
      BASE: production/zhenguo_wanfo/assembly/MP01B_GATE_T3_TUOJIAO_FIRST_GEOMETRY_BUILD_PREPARATION_V001.json
      PROFILE: production/zhenguo_wanfo/assembly/MP01B_CIRCLE1_INTERIOR_HUAGONG_VISIBLE_PROFILE_RESOLUTION_V001.json
      PREP: production/zhenguo_wanfo/assembly/MP01B_CIRCLE1_TARGETED_BUILD_PREPARATION_V001.json
      BUILDER: production/zhenguo_wanfo/scripts/mp01b_circle1_targeted_build_v001.py
      VALIDATOR: production/zhenguo_wanfo/scripts/validate_mp01b_circle1_targeted_build_v001.py
      OUT: artifacts/mp01b_t047_circle1
      REVIEW: artifacts/mp01b_t047_circle1/review
      ASSET: artifacts/mp01b_t047_circle1/MP01B_CIRCLE1_TARGETED_BUILD_V001.blend
      SEM: artifacts/mp01b_t047_circle1/MP01B_CIRCLE1_TARGETED_BUILD_SEMANTIC_V001.json
      BOARD: artifacts/mp01b_t047_circle1/MP01B_T047_REVIEW_BOARD_V001.png
      VAL: artifacts/mp01b_t047_circle1/MP01B_T047_VALIDATION_V001.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Blender 4.5.13 and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 fonts-noto-cjk
          curl --fail --location --show-error --retry 3 --user-agent "Mozilla/5.0 GitHubActions T047" -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C /tmp
          "$BLENDER" --version | grep -Eq '^Blender 4\.5\.13( LTS)?$'
          python -m pip install --disable-pip-version-check pillow

      - name: Circle 1 authorization precheck
        shell: bash
        run: |
          set -euo pipefail
          python - "$PREP" "$PROFILE" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          c=json.load(open(sys.argv[2],encoding="utf-8"))
          assert p["task_id"]=="T-047"
          assert p["product_owner_authorization"]["authorized"] is True
          assert p["blender_authorized"] is True
          assert c["product_owner_approved"] is True
          assert c["candidate_id"]=="MP01B_INTERIOR_HUAGONG_VISIBLE_PROFILE_V001_C01"
          assert c["circle_2_resolved"] is False
          assert c["circle_3_resolved"] is False
          print("MP01B_CIRCLE1_AUTHORIZATION_PASS")
          PY

      - name: Canonical Circle 1 targeted build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$REVIEW"
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$BUILDER" -- --mode build --contract "$BASE" --profile-control "$PROFILE" --asset "$ASSET" --semantic "$SEM" --review-dir "$REVIEW"

      - name: Independent reopen
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background "$ASSET" --python-exit-code 10 --python "$BUILDER" -- --mode inspect --expected "$SEM" --output "$OUT/reopen.json"

      - name: Profile tip mutation 0.15 to 0.25
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$BUILDER" -- --mode build --contract "$BASE" --profile-control "$PROFILE" --gonghead-tip-depth-fraction 0.25 --asset "$OUT/mutation.blend" --semantic "$OUT/mutation.json"

      - name: Deterministic canonical rebuild
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$BUILDER" -- --mode build --contract "$BASE" --profile-control "$PROFILE" --asset "$OUT/rebuild.blend" --semantic "$OUT/rebuild.json"

      - name: Compose Review Board
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATOR" --mode compose-board --canonical "$SEM" --review-dir "$REVIEW" --board "$BOARD"

      - name: Validate T-047
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATOR" --mode validate --prep "$PREP" --profile "$PROFILE" --canonical "$SEM" --mutation "$OUT/mutation.json" --reopen "$OUT/reopen.json" --rebuild "$OUT/rebuild.json" --asset "$ASSET" --review-dir "$REVIEW" --board "$BOARD" --output "$VAL"
          python - "$VAL" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding="utf-8"))
          assert v["status"]=="PASS"
          print("MP01B_T047_MACHINE_PASS",v["check_count"])
          PY

      - name: Upload T-047 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP01B_T047_CIRCLE1_TARGETED_BUILD_V001
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.SEM }}
            ${{ env.BOARD }}
            ${{ env.VAL }}
            ${{ env.REVIEW }}/*.png
