name: T-023 Approved Formal Delivery Publication

on:
  push:
    branches:
      - codex/t023-p3-3-dingfu-master-first-article-v001
    paths:
      - '.github/workflows/p3_3_t023_publication.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-approved-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '35490552809'
      SOURCE_ARTIFACT: P3_3_T023_DINGFU_FIRST_ARTICLE_V001
      MASTER_ROOT: production/zhenguo_wanfo/component_library/masters/CMP-FRAME-DINGFU-001
      REVIEW_ROOT: production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-DINGFU-001
      VALIDATION_ROOT: production/zhenguo_wanfo/validation
      CATALOG: production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/t023-p3-3-dingfu-master-first-article-v001
          fetch-depth: 0

      - name: Download approved T-023 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: /tmp/t023-approved
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify approved artifact identity
        run: |
          set -euo pipefail
          cd /tmp/t023-approved
          sha256sum -c artifacts/t023/SHA256SUMS.txt
          test "$(sha256sum artifacts/t023/CMP-FRAME-DINGFU-001_MASTER_V001.blend | awk '{print $1}')" = "81fa6c593b90c40766c6cc2098b4759c7747cf9bbc77c9c409f5320f88c7c737"
          python - <<'PY'
          import json
          p="/tmp/t023-approved/artifacts/t023/CMP-FRAME-DINGFU-001_MASTER_VALIDATION_V001.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["status"]=="PASS"
          assert d["check_count"]==36
          assert all(v=="PASS" for v in d["checks"].values())
          assert d["canonical_blend_sha256"]=="81fa6c593b90c40766c6cc2098b4759c7747cf9bbc77c9c409f5320f88c7c737"
          assert d["semantic_geometry_signature"]=="2cb4b6bcae382f9a35dbca3063439aa025e0b6bba18c4175f63c1f13d089f982"
          print("T023_APPROVED_ARTIFACT_IDENTITY_PASS")
          PY

      - name: Materialize approved formal delivery
        run: |
          set -euo pipefail
          mkdir -p "$MASTER_ROOT" "$REVIEW_ROOT" "$VALIDATION_ROOT"
          cp /tmp/t023-approved/artifacts/t023/canonical_semantic.json             "$MASTER_ROOT/CMP-FRAME-DINGFU-001_MASTER_SEMANTIC_V001.json"
          cp /tmp/t023-approved/artifacts/t023/CMP-FRAME-DINGFU-001_MASTER_VALIDATION_V001.json             "$VALIDATION_ROOT/CMP-FRAME-DINGFU-001_MASTER_VALIDATION_V001.json"
          cp /tmp/t023-approved/artifacts/t023/P3_3_T023_DINGFU_ENGINEERING_REVIEW_V001.md             docs/production/zhenguo_wanfo/P3_3_T023_DINGFU_ENGINEERING_REVIEW_V001.md
          cp /tmp/t023-approved/production/zhenguo_wanfo/review/P3_3/masters/CMP-FRAME-DINGFU-001/*.png             "$REVIEW_ROOT/"

      - name: Register approved Dingfu in Stage1 Catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["task"]="T-023"
          d["status"]="NINE_APPROVED / T021+T022+T023 PRODUCT_OWNER_APPROVED"
          d["approved_master_count"]=9
          records=d.setdefault("new_masters",[])
          ping=next((x for x in records if x.get("component_id")=="CMP-FRAME-DINGFU-001"),None)
          if ping is None:
              ping={}
              records.append(ping)
          ping.clear()
          ping.update({
              "component_id":"CMP-FRAME-DINGFU-001",
              "master_id":"CMP-FRAME-DINGFU-001_MASTER",
              "master_version":"V001",
              "role_variants":["UPPER","LOWER"],
              "approval_status":"PRODUCT_OWNER_APPROVED",
              "decision_id":"D-080",
              "publication_status":"FORMAL_DELIVERY_MATERIALIZED / PR_MERGE_PENDING",
              "canonical_asset_status":"ACTIONS_ARTIFACT / APPROVED",
              "canonical_asset_sha256":"81fa6c593b90c40766c6cc2098b4759c7747cf9bbc77c9c409f5320f88c7c737",
              "semantic_geometry_signature":"2cb4b6bcae382f9a35dbca3063439aa025e0b6bba18c4175f63c1f13d089f982",
              "canonical_section_mm":{"width":331.6,"thickness":200.9},
              "historical_full_length_mm":None,
              "canonical_reference_length_mm":1000.0,
              "groove_boundary":"DIRECT_EXISTENCE / GEOMETRY_DEFERRED",
              "formal_delivery":{
                  "validation":"production/zhenguo_wanfo/validation/CMP-FRAME-DINGFU-001_MASTER_VALIDATION_V001.json",
                  "engineering_review":"docs/production/zhenguo_wanfo/P3_3_T023_DINGFU_ENGINEERING_REVIEW_V001.md",
                  "product_owner_acceptance":"docs/production/zhenguo_wanfo/P3_3_T023_DINGFU_PRODUCT_OWNER_ACCEPTANCE_V001.md",
                  "review_png_count":6
              }
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("T023_CATALOG_REGISTRATION_PASS")
          PY

      - name: Formal delivery self-check
        run: |
          set -euo pipefail
          test "$(find "$REVIEW_ROOT" -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json").read_text())
          x=next(v for v in cat["new_masters"] if v["component_id"]=="CMP-FRAME-DINGFU-001")
          assert x["approval_status"]=="PRODUCT_OWNER_APPROVED"
          assert x["decision_id"]=="D-080"
          assert x["canonical_asset_sha256"]=="81fa6c593b90c40766c6cc2098b4759c7747cf9bbc77c9c409f5320f88c7c737"
          assert x["semantic_geometry_signature"]=="2cb4b6bcae382f9a35dbca3063439aa025e0b6bba18c4175f63c1f13d089f982"
          assert x["groove_boundary"]=="DIRECT_EXISTENCE / GEOMETRY_DEFERRED"
          v=json.loads(Path("production/zhenguo_wanfo/validation/CMP-FRAME-DINGFU-001_MASTER_VALIDATION_V001.json").read_text())
          assert v["check_count"]==36 and all(y=="PASS" for y in v["checks"].values())
          print("T023_FORMAL_DELIVERY_SELF_CHECK_PASS")
          PY

      - name: Commit approved formal delivery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "$MASTER_ROOT/CMP-FRAME-DINGFU-001_MASTER_SEMANTIC_V001.json"             "$REVIEW_ROOT"             "$VALIDATION_ROOT/CMP-FRAME-DINGFU-001_MASTER_VALIDATION_V001.json"             docs/production/zhenguo_wanfo/P3_3_T023_DINGFU_ENGINEERING_REVIEW_V001.md             "$CATALOG"
          git diff --cached --check
          if git diff --cached --name-only | grep -E '\.blend$'; then
            echo "T-023 staged delivery must not include .blend files"
            exit 1
          fi
          git commit -m "T-023: materialize approved formal delivery"
          git push origin HEAD:codex/t023-p3-3-dingfu-master-first-article-v001
