name: Wanfo Museum B01-B04 Real Mesh Contact Section G4
on:
  push:
    branches:
      - evidence/wanfo-museum-b01b04-contact-section-g4-20261108
    paths:
      - review/dougong_b01b04_g4_v001/analyze_contact_blender.py
      - .github/workflows/wanfo_museum_b01b04_contact_g4.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wanfo-museum-b01b04-g4
  cancel-in-progress: false
jobs:
  section-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare pinned Blender 4.5.13
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar xf /tmp/blender.tar.xz -C /tmp
      - name: Recheck source SHA, run 6 real triangle pair tests and render 2 actual mesh cuts
        run: |
          /tmp/blender-4.5.13-linux-x64/blender -b --factory-startup --python-exit-code 7 --python review/dougong_b01b04_g4_v001/analyze_contact_blender.py
      - name: Archive derived numerical evidence only
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('review/dougong_b01b04_g4_v001/output/G4_REAL_MESH_SECTION_REPORT.json')
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({"status":"FAIL_G4_SETUP","gates":{}},ensure_ascii=False,indent=2)+"\n")
          j=json.loads(p.read_text())
          print('G4_RESULT',j.get('status'))
          print('G4_PAIRS',[(x.get('pair'),x.get('intersection_face_pair_count')) for x in j.get('pair_checks',[])])
          print('G4_REPORT_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/dougong_b01b04_g4_v001/output/G4_REAL_MESH_SECTION_REPORT.json
          if ! git diff --cached --quiet; then
            git diff --cached --name-only | python -c 'import sys;x=sys.stdin.read().splitlines();assert x==["review/dougong_b01b04_g4_v001/output/G4_REAL_MESH_SECTION_REPORT.json"],x'
            git commit -m 'evidence: G4 original mesh pair interaction and true section gates'
            git pull --rebase origin evidence/wanfo-museum-b01b04-contact-section-g4-20261108
            git push origin HEAD:evidence/wanfo-museum-b01b04-contact-section-g4-20261108
          fi
      - name: Temporary four-view geometry evidence only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WANFO_MUSEUM_G4_B01_B04_MESH_SECTIONS
          path: |
            review/dougong_b01b04_g4_v001/output/G4_REAL_MESH_SECTION_REPORT.json
            review/dougong_b01b04_g4_v001/_ephemeral_visuals/*.png
          retention-days: 7
