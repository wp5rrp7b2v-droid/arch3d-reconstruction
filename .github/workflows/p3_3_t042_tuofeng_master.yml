name: T-042 Tuofeng Master First Article

on:
  pull_request:
    branches:
      - governance/v008-tuofeng-master-scope-patch-v001
    paths:
      - '.github/workflows/p3_3_t042_tuofeng_master.yml'
      - 'docs/tasks/T-042_P3_3_TUOFENG_MASTER_V001.md'
      - 'production/zhenguo_wanfo/component_library/masters/CMP-FRAME-TUOFENG-001/**'
      - 'production/zhenguo_wanfo/scripts/tuofeng_master_common_v001.py'
      - 'production/zhenguo_wanfo/scripts/validate_t042_tuofeng.py'
      - 'production/zhenguo_wanfo/registry/P3_3_TUOFENG_FIRST_ARTICLE_BUILD_PREPARATION_V001.json'
      - 'docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-article:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BLENDER: /tmp/blender-4.5.13-linux-x64/blender
      DEF: production/zhenguo_wanfo/component_library/masters/CMP-FRAME-TUOFENG-001/CMP-FRAME-TUOFENG-001_MASTER_DEFINITION_V001.json
      WRAPPER: production/zhenguo_wanfo/component_library/masters/CMP-FRAME-TUOFENG-001/build_tuofeng_master_v001.py
      VALIDATOR: production/zhenguo_wanfo/scripts/validate_t042_tuofeng.py
      REGISTRY: docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json
      OUT: artifacts/t042
      REVIEW: artifacts/t042/review
      ASSET: artifacts/t042/CMP-FRAME-TUOFENG-001_MASTER_V001.blend
      SEM: artifacts/t042/CMP-FRAME-TUOFENG-001_MASTER_SEMANTIC_V001.json
      BOARD: artifacts/t042/CMP-FRAME-TUOFENG-001_MASTER_REVIEW_BOARD_V001.png
      VAL: artifacts/t042/CMP-FRAME-TUOFENG-001_MASTER_VALIDATION_V001.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Blender 4.5.13 and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 fonts-noto-cjk
          curl --fail --location --show-error --retry 3 --user-agent "Mozilla/5.0 GitHubActions T042" -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C /tmp
          "$BLENDER" --version | grep -Eq '^Blender 4\.5\.13( LTS)?$'
          python -m pip install --disable-pip-version-check pillow

      - name: Precheck locked definition
        shell: bash
        run: |
          set -euo pipefail
          python - "$DEF" "$REGISTRY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          r=json.load(open(sys.argv[2],encoding="utf-8"))
          assert d["task_id"]=="T-042"
          assert d["status"].startswith("LOCKED / PRODUCT_OWNER_APPROVED")
          assert d["execution_boundary"]["engineering_execution_authorized"] is True
          assert d["execution_boundary"]["blender_execution_authorized"] is True
          assert d["family_architecture"]["master_family_count"]==1
          assert d["family_architecture"]["role_variant_count"]==2
          tf=[x for x in r["items"] if x.get("component")=="驼峰"]
          assert len(tf)==1
          assert tf[0]["master_coverage_status"]=="MASTER_REQUIRED_PENDING"
          print("T042_DEFINITION_PRECHECK_PASS")
          PY

      - name: Build canonical first article
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$REVIEW"
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$WRAPPER" -- --mode build --definition "$DEF" --fixture-set A --asset "$ASSET" --semantic "$SEM" --review-dir "$REVIEW"

      - name: Independent reopen
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background "$ASSET" --python-exit-code 10 --python "$WRAPPER" -- --mode inspect --asset "$ASSET" --expected "$SEM" --output "$OUT/reopen.json"

      - name: Mutation build
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$WRAPPER" -- --mode build --definition "$DEF" --fixture-set B --asset "$OUT/mutation.blend" --semantic "$OUT/mutation.json"

      - name: Deterministic restore build
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 10 --python "$WRAPPER" -- --mode build --definition "$DEF" --fixture-set A --asset "$OUT/restore.blend" --semantic "$OUT/restore.json"

      - name: Compose Review Board
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATOR" --mode compose-board --definition "$DEF" --canonical "$SEM" --mutation "$OUT/mutation.json" --review-dir "$REVIEW" --board "$BOARD"

      - name: Validate first article
        shell: bash
        run: |
          set -euo pipefail
          python "$VALIDATOR" --mode validate --definition "$DEF" --canonical "$SEM" --mutation "$OUT/mutation.json" --reopen "$OUT/reopen.json" --restore "$OUT/restore.json" --registry "$REGISTRY" --asset "$ASSET" --review-dir "$REVIEW" --board "$BOARD" --output "$VAL"
          python - "$VAL" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding="utf-8"))
          assert v["status"]=="PASS"
          print("T042_FIRST_ARTICLE_MACHINE_PASS",v["check_count"])
          PY

      - name: Assert binary not tracked
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files -- 'production/zhenguo_wanfo/component_library/masters/CMP-FRAME-TUOFENG-001/*.blend' 'production/zhenguo_wanfo/component_library/masters/CMP-FRAME-TUOFENG-001/asset/*.blend')"

      - name: Upload T-042 first article
        uses: actions/upload-artifact@v4
        with:
          name: P3_3_T042_TUOFENG_MASTER_FIRST_ARTICLE_V001
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.SEM }}
            ${{ env.BOARD }}
            ${{ env.VAL }}
            ${{ env.REVIEW }}/*.png
