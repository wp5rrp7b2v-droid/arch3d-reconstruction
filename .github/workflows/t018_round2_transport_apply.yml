name: T-018 Round 2 Transport Apply
# strict file-SHA-gated transport reconstruction for the existing T-018 PR branch

on:
  push:
    branches:
      - codex/t-018

permissions:
  contents: write

jobs:
  apply-round2-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/t-018
          fetch-depth: 0

      - name: Reconstruct and verify Round 2 target files
        shell: bash
        run: |
          set -euo pipefail
          test -d .tmp_t018_round2
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, itertools, shutil, subprocess, tarfile, tempfile

          expected = {
            '.github/workflows/p3_3_t018_whole_building.yml':'5b9a3e60e0b9f0ebebcd81511bff811ef19d3f02af04371d8b97449681543b1c',
            'production/zhenguo_wanfo/build/P3_3_WHOLE_BUILDING_RUNTIME_MANIFEST_V001.json':'fe7362eae9d1b81f477cab0eb08492c076cf66923327b060c7713b2c231172ac',
            'production/zhenguo_wanfo/review/P3_3_T018/P3_3_T018_EVIDENCE_MANIFEST_V001.json':'ff1c5550e474d2682fa90ab6f832ea1bd72d1dca8b6e9d817362695985ea2a23',
            'production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py':'578a15ce00097932a50c16b89b0a747dc34cdbd3ee0bd42f72c360c24e5397ee',
            'production/zhenguo_wanfo/scripts/p3_3_whole_building_common_v001.py':'0498a17cc2a8d783bc2929dbd4466435ba2e8e656aedf9f5994c07cf54359ec8',
            'production/zhenguo_wanfo/scripts/render_p3_3_whole_building_review_v001.py':'1514efde3c59c865fbcb00aa90f5cdc10295b4444db8d6d8521aec00e01760bd',
            'production/zhenguo_wanfo/scripts/validate_p3_3_whole_building_v001.py':'985a38851ce87311e912dcf3bad0492d32d3dbd77a5d63c660dcbb7c2304a367',
            'production/zhenguo_wanfo/tests/test_p3_3_whole_building_v001.py':'369ce74f97d9f4f7d80c1bb48284fcda71bd928cbb66eb9abb205f6052c3c1b4',
            'production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_MUTATION_V001.json':'329f618695c8df672b1e3ed39a35b68f8e34f47f89e1dd06d931ef60b55c44d8',
            'production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_VALIDATION_V001.json':'cfd134f83592be4451f59d4044483aa7e681b6836deaefa061daba9b716442bc',
          }
          patch_sha='99a22d0e93525be91de9e6f93912d8fbec53fb48b3c65d63a7cd1b466b6cf41f'
          alphabet=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          parts=[]
          for n in range(1,7):
              s=Path(f'.tmp_t018_round2/part{n}.b64').read_text(encoding='ascii')
              parts.append(''.join(ch for ch in s if ch in alphabet))
          def pad(s): return s+'='*((-len(s))%4)
          def hashes_ok(root):
              root=Path(root)
              for rel,want in expected.items():
                  p=root/rel
                  if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=want:
                      return False
              files={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '.git/' not in str(p)}
              return files==set(expected)
          out=Path('/tmp/t018_round2_materialized')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          found=False
          for perm in itertools.permutations(range(1,6)):
              order=(0,)+perm
              s=''.join(parts[i] for i in order)
              try: raw=base64.b64decode(pad(s),validate=False)
              except Exception: continue
              # Candidate 1: gzip contains the original unified patch.
              try:
                  payload=gzip.decompress(raw)
              except Exception:
                  payload=None
              if payload is not None and hashlib.sha256(payload).hexdigest()==patch_sha:
                  tmp=Path(tempfile.mkdtemp(prefix='t018patch_'))
                  subprocess.run(['git','init','-q'],cwd=tmp,check=True)
                  pp=tmp/'round2.patch'; pp.write_bytes(payload)
                  subprocess.run(['git','apply','--check',str(pp)],cwd=tmp,check=True)
                  subprocess.run(['git','apply',str(pp)],cwd=tmp,check=True)
                  if hashes_ok(tmp):
                      shutil.rmtree(out); shutil.copytree(tmp,out); found=True
                      print('validated unified patch, order=',tuple(i+1 for i in order)); break
              # Candidate 2: gzip stream is a tar.gz archive of the ten target files.
              try:
                  with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
                      tmp=Path(tempfile.mkdtemp(prefix='t018tar_'))
                      members=tf.getmembers()
                      for m in members:
                          name=Path(m.name)
                          if m.isfile() and (name.is_absolute() or '..' in name.parts):
                              raise RuntimeError('unsafe archive path')
                      tf.extractall(tmp,filter='data')
                      # tolerate a single wrapper directory
                      roots=[tmp]
                      dirs=[p for p in tmp.iterdir() if p.is_dir()]
                      if len(dirs)==1: roots.append(dirs[0])
                      good=next((r for r in roots if hashes_ok(r)),None)
                      if good:
                          shutil.rmtree(out); shutil.copytree(good,out); found=True
                          print('validated tar archive, order=',tuple(i+1 for i in order)); break
              except Exception:
                  pass
          if not found:
              raise SystemExit('Unable to reconstruct a payload whose ten target-file SHA256 values match the approved Round 2 files')
          print('Round 2 target-file SHA256 verification: PASS (10/10)')
          PY

      - name: Replace only the approved T-018 files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('/tmp/t018_round2_materialized'); dst=Path.cwd()
          paths=['.github/workflows/p3_3_t018_whole_building.yml','production/zhenguo_wanfo/build/P3_3_WHOLE_BUILDING_RUNTIME_MANIFEST_V001.json','production/zhenguo_wanfo/review/P3_3_T018/P3_3_T018_EVIDENCE_MANIFEST_V001.json','production/zhenguo_wanfo/scripts/build_p3_3_whole_building_v001.py','production/zhenguo_wanfo/scripts/p3_3_whole_building_common_v001.py','production/zhenguo_wanfo/scripts/render_p3_3_whole_building_review_v001.py','production/zhenguo_wanfo/scripts/validate_p3_3_whole_building_v001.py','production/zhenguo_wanfo/tests/test_p3_3_whole_building_v001.py','production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_MUTATION_V001.json','production/zhenguo_wanfo/validation/P3_3_WHOLE_BUILDING_VALIDATION_V001.json']
          for rel in paths:
              target=dst/rel; target.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src/rel,target)
          PY
          rm -rf .tmp_t018_round2
          rm -f .github/workflows/t018_round2_transport_apply.yml
          rm -f .github/workflows/t018_round2_apply_payload.yml

      - name: Pre-publish regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest production/zhenguo_wanfo/tests/test_p3_3_whole_building_v001.py production/zhenguo_wanfo/tests/test_p3_3_building_graph_v001.py production/zhenguo_wanfo/tests/test_p2_2_structural_skeleton_v001.py
          python -m compileall -q production/zhenguo_wanfo/scripts production/zhenguo_wanfo/tests
          git diff --check
          if git diff --name-only | grep -q '^docs/project_control/'; then echo 'Project Control modification is forbidden' >&2; exit 1; fi

      - name: Publish Round 2 to existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Caroline'
          git config user.email 'wp5rrp7b2v@privaterelay.appleid.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^docs/project_control/' || true)"
          git commit -m 'Apply T-018 Round 2 whole-building rule consumer correction'
          git push origin HEAD:codex/t-018
