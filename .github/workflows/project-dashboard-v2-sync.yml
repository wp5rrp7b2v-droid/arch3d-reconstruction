name: Dashboard / Project State Consistency

on:
  push:
    branches:
      - main
    paths:
      - "docs/project_control/project_state.json"
      - "docs/project_control/dashboard.html"
      - "scripts/check_dashboard_project_state.py"
      - ".github/workflows/project-dashboard-v2-sync.yml"
  pull_request:
    paths:
      - "docs/project_control/project_state.json"
      - "docs/project_control/dashboard.html"
      - "scripts/check_dashboard_project_state.py"
      - ".github/workflows/project-dashboard-v2-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard against canonical Project State (read only)
        run: python scripts/check_dashboard_project_state.py --self-test
