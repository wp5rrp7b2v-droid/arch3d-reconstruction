name: Project Dashboard V2 Sync

on:
  push:
    branches:
      - main
    paths:
      - "docs/project_control/project_state.json"
      - "docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json"
      - "production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json"
      - "production/zhenguo_wanfo/registry/P3_3_STAGE1_MASTER_COVERAGE_DISPOSITION_MATRIX_V002.json"
      - "scripts/generate_project_dashboard.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate Dashboard V2 from canonical sources
        run: python scripts/generate_project_dashboard.py

      - name: Validate current-state markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          html = Path("docs/project_control/dashboard.html").read_text(encoding="utf-8")
          reg = json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json").read_text(encoding="utf-8"))
          matrix = json.loads(Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_MASTER_COVERAGE_DISPOSITION_MATRIX_V002.json").read_text(encoding="utf-8"))

          progress = reg["stage1_master_progress_summary"]
          approved = set(progress["approved_master_components"])
          scope = [row for row in matrix["rows"] if "Master" in str(row.get("disposition", ""))]
          pending = [row for row in scope if row["component"] not in approved]
          pending = sorted(pending, key=lambda row: (999 if row.get("priority") is None else row["priority"], row["component"]))
          next_target = pending[0]["component"] if pending else "NONE"
          pct_text = f'{float(progress["master_completion_percent"]):.1f}'

          markers = [
              "Dashboard V2",
              f'{progress["approved_master_count"]} / {progress["master_scope_object_type_count"]}',
              f'{pct_text}%',
              f'下一目标：{next_target}',
              "T-018 HOLD",
          ]
          missing = [marker for marker in markers if marker not in html]
          assert not missing, f"Dashboard current-state markers missing: {missing}"
          print("DASHBOARD_CURRENT_STATE_VALIDATION_PASS", markers)
          PY

      - name: Commit derived Dashboard only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/project_control/dashboard.html; then
            echo "Dashboard already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project_control/dashboard.html
          git commit -m "derived: sync Project Dashboard V2"
          git push origin main
