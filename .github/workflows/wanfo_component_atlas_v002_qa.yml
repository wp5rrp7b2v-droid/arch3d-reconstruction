name: Wanfo atlas V002 image and real Chrome QA
on:
  push:
    branches: [visualization/wanfo-component-atlas-v001-20261017]
    paths:
      - tools/component_atlas/v002_*.py
      - docs/component_atlas_v001/v002.css
      - docs/component_atlas_v001/v002.js
      - .github/workflows/wanfo_component_atlas_v002_qa.yml
permissions:
  contents: write
concurrency:
  group: wanfo-atlas-v002
  cancel-in-progress: false
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling and Chrome automation client
        run: |
          python -m pip install pillow numpy playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          google-chrome --version
      - name: Derive all 79 visual pages from unchanged sources and model views
        run: python tools/component_atlas/v002_build.py
      - name: Validate sources, scope, model identity and original state
        run: python tools/component_atlas/v002_validate.py
      - name: Actual Chrome file and HTTP browsing, all pages
        run: python tools/component_atlas/v002_browser.py
      - name: Final complete static validation
        run: python tools/component_atlas/v002_validate.py
      - name: Save derived atlas and review evidence to the existing branch only
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = visualization/wanfo-component-atlas-v001-20261017
          test -f docs/component_atlas_v001/assets/v002/PAGE_COVERAGE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/component_atlas_v001/index.html docs/component_atlas_v001/pages docs/component_atlas_v001/assets/v002 docs/component_atlas_v001/qa
          git diff --cached --quiet || git commit -m "构件图库V002：79页形态图、差异标注与实际Chrome验证"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WANFO_ATLAS_V002_BROWSER_REVIEW
          path: docs/component_atlas_v001/qa
          retention-days: 90
