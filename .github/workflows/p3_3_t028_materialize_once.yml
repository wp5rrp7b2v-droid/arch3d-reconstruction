name: T-028 One-time Approved Artifact Materialization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/p3_3_t028_materialize_once.yml"

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.event.pull_request.number == 16 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T-028 PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download D-111 accepted first article
        uses: actions/download-artifact@v4
        with:
          name: P3_3_T-028_MASTER_V2_FIRST_ARTICLE_V001
          path: /tmp/t028-approved
          github-token: ${{ github.token }}
          repository: wp5rrp7b2v-droid/arch3d-reconstruction
          run-id: 35825911214

      - name: Verify exact accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/t028-approved
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          echo "25da16f9e69c930ff4b37523c23bb19ac7ef1f3c5dcf2ffcc7dcaf17f35eff25  CMP-FRAME-CHASHOU-001_MASTER_V001.blend" | sha256sum -c -
          echo "28ccd0ea91f8935ebbeaa7c4c9be59ea1bd25c8acc790cbec53342477d86f05d  CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json" | sha256sum -c -
          echo "e8cb259cb5fa9be474bce120c0984ae02c7159c1ad27bdc5d63deb457c4dcde6  CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json" | sha256sum -c -
          echo "07bf0761410b3db9c7bc00161a04a34027ca7711f38437978715f3807eda577f  CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          echo "338c885cb4cc453edc909ea100637ef714865764a3b0b682f23c6250264b59db  production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001/CMP-FRAME-CHASHOU-001_MASTER_DEFINITION_V001.json" | sha256sum -c -
          echo "T028_APPROVED_BYTE_IDENTITY_PASS"

      - name: Materialize approved formal outputs and bind Catalog / V008
        shell: bash
        run: |
          set -euo pipefail
          DEST="production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001"
          mkdir -p "$DEST"
          cp /tmp/t028-approved/CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json "$DEST/"
          cp /tmp/t028-approved/CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json "$DEST/"
          cp /tmp/t028-approved/CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png "$DEST/"

          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path=Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json")
          registry_path=Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json")
          task_path=Path("docs/tasks/T-028_P3_3_CHASHOU_MASTER_V2_V001.md")

          catalog=json.loads(catalog_path.read_text(encoding="utf-8"))
          assert catalog["approved_master_count"]==13
          assert not any(x.get("master_id")=="CMP-FRAME-CHASHOU-001_MASTER" for x in catalog.get("new_masters",[]))

          catalog["task"]="T-028"
          catalog["status"]="FOURTEEN_APPROVED / T028 PRODUCT_OWNER_APPROVED / FORMALIZED ON PR #16 / MERGE PENDING"
          catalog["new_masters"].append({
            "component_id":"CMP-FRAME-CHASHOU-001",
            "master_id":"CMP-FRAME-CHASHOU-001_MASTER",
            "master_version":"V001",
            "approval_status":"PRODUCT_OWNER_APPROVED",
            "decision_id":"D-111",
            "formalization_authority":"D-112",
            "publication_status":"FORMALIZED / PR #16 MERGE PENDING",
            "canonical_asset_status":"ACTIONS_ARTIFACT / APPROVED / LOCAL_RESTORE_PENDING",
            "canonical_asset_sha256":"25da16f9e69c930ff4b37523c23bb19ac7ef1f3c5dcf2ffcc7dcaf17f35eff25",
            "semantic_sha256":"28ccd0ea91f8935ebbeaa7c4c9be59ea1bd25c8acc790cbec53342477d86f05d",
            "validation_sha256":"e8cb259cb5fa9be474bce120c0984ae02c7159c1ad27bdc5d63deb457c4dcde6",
            "review_board_sha256":"07bf0761410b3db9c7bc00161a04a34027ca7711f38437978715f3807eda577f",
            "semantic_geometry_signature":"410a64eac567e256253e56b94ab44f8273ccac634fa01a1d211913ca1b0bd72e",
            "canonical_section_mm":{"width":230.5,"thickness":90.5},
            "source_internal_numeric_conflict":False,
            "historical_full_length_mm":None,
            "canonical_reference_length_mm":1000,
            "geometry_mode":"PARAMETRIC_ENDPOINT_DRIVEN_LONG_MEMBER",
            "physical_instance_count":8,
            "distribution":"INTERIOR_FRAME 4 / GABLE_FRAME 4",
            "geometry_variant_count":0,
            "endpoint_policy":"ACTUAL LENGTH / CENTER / ORIENTATION ARE ASSEMBLY-ENDPOINT-DERIVED",
            "historical_joinery":"UNRESOLVED_METADATA / STAGE1 SIMPLIFIED FLAT END",
            "source_artifact":{
              "actions_run_id":35825911214,
              "artifact_id":10735946772,
              "artifact_zip_sha256":"5c4a77a41291433b590911d4b1c6aa806a1b2dff579d2cecc80ca1bbd28b4151"
            },
            "minimal_sufficient_package":{
              "policy":"ADAPTIVE / NO UNIVERSAL FILE COUNT",
              "component_specific_formal_file_count":6,
              "formal_repo_files":[
                "production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001/CMP-FRAME-CHASHOU-001_MASTER_DEFINITION_V001.json",
                "production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001/CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json",
                "production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001/CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png",
                "production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001/CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json",
                "docs/tasks/T-028_P3_3_CHASHOU_MASTER_V2_V001.md"
              ],
              "canonical_blend":"ACTIONS_ARTIFACT + LOCAL ONLY / NOT GIT",
              "review_board_count":1,
              "required_review_panel_count":6
            },
            "accepted_engineering_head":"eba3b798f05de54713910549bd198dbb43110f26"
          })
          catalog["approved_master_count"]=14
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          reg=json.loads(registry_path.read_text(encoding="utf-8"))
          assert reg["schema_version"]=="V008"
          ch=[x for x in reg["items"] if x.get("component")=="叉手"]
          assert len(ch)==8
          assert all(x.get("master_coverage_status")=="MASTER_REQUIRED_PENDING" for x in ch)
          for x in ch:
            x["master_coverage_status"]="APPROVED_MASTER_AVAILABLE"
            x["master_reference"]="CMP-FRAME-CHASHOU-001_MASTER"

          note=reg.get("generation_note","")
          add=" D-111 approves the Chashou first article; D-112 formalizes the accepted outputs and binds all 8 叉手 records to CMP-FRAME-CHASHOU-001_MASTER on PR #16 pending merge."
          if add.strip() not in note:
            reg["generation_note"]=note+add

          p=reg["stage1_master_progress_summary"]
          assert p["approved_master_count"]==13
          assert p["master_covered_registry_record_count"]==111
          p["snapshot_date"]="2026-09-23"
          p["status"]="PR #16 FORMALIZED CANDIDATE / D-111 CHASHOU APPROVED / D-112 CATALOG+V008 BINDING / MERGE PENDING"
          p["approved_master_count"]=14
          p["pending_master_object_type_count"]=14
          p["master_completion_percent"]=50.0
          if "叉手" not in p["approved_master_components"]:
            p["approved_master_components"].append("叉手")
          p["master_covered_registry_record_count"]=119
          p["progress_display_note"]="505 is registry-record count, not a whole-building physical-piece total. Stage1 Master completion uses 28 Master-scope object types as denominator: 14 approved / 14 pending = 50.0%. This is a PR #16 formalized candidate until merge to main."
          assert sum(1 for x in reg["items"] if x.get("master_coverage_status")=="APPROVED_MASTER_AVAILABLE")==119
          registry_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          task=task_path.read_text(encoding="utf-8").rstrip()
          section="""

## 25. D-112 exact materialization + Catalog/V008 binding

Formalization executed from the D-111 accepted artifact.

Exact bytes verified before publication:
- canonical .blend: `25da16f9e69c930ff4b37523c23bb19ac7ef1f3c5dcf2ffcc7dcaf17f35eff25` — verified, **not committed**
- Semantic: `28ccd0ea91f8935ebbeaa7c4c9be59ea1bd25c8acc790cbec53342477d86f05d`
- Validation: `e8cb259cb5fa9be474bce120c0984ae02c7159c1ad27bdc5d63deb457c4dcde6`
- Review Board: `07bf0761410b3db9c7bc00161a04a34027ca7711f38437978715f3807eda577f`

Formalized PR-branch candidate:
- Stage1 Catalog approved Masters: **14**
- V008 Chashou binding: **8 / 8**
- approved-Master-covered Registry records: **119**
- Stage1 Master completion candidate: **14 / 28 = 50.0%**
- next Master-scope target after Chashou: **蜀柱**

This state is not canonical on `main` until PR #16 merge.
PR #16 merge remains separately unauthorized.
"""
          if "## 25. D-112 exact materialization + Catalog/V008 binding" not in task:
            task_path.write_text(task+section+"\n",encoding="utf-8")
          PY

          # Prepare Dashboard sync assertions for the state that becomes canonical only after PR #16 merge.
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/project-dashboard-v2-sync.yml")
          s=p.read_text(encoding="utf-8")
          s=s.replace('grep -q "13 / 28" docs/project_control/dashboard.html','grep -q "14 / 28" docs/project_control/dashboard.html')
          s=s.replace('grep -q "46.4%" docs/project_control/dashboard.html','grep -q "50.0%" docs/project_control/dashboard.html')
          s=s.replace('grep -q "下一目标：叉手" docs/project_control/dashboard.html','grep -q "下一目标：蜀柱" docs/project_control/dashboard.html')
          p.write_text(s,encoding="utf-8")
          PY

          # One-time workflow must not enter the final PR.
          rm -f .github/workflows/p3_3_t028_materialize_once.yml

      - name: Cross-check formalization surface
        shell: bash
        run: |
          set -euo pipefail
          DEST="production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001"
          echo "28ccd0ea91f8935ebbeaa7c4c9be59ea1bd25c8acc790cbec53342477d86f05d  $DEST/CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json" | sha256sum -c -
          echo "e8cb259cb5fa9be474bce120c0984ae02c7159c1ad27bdc5d63deb457c4dcde6  $DEST/CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json" | sha256sum -c -
          echo "07bf0761410b3db9c7bc00161a04a34027ca7711f38437978715f3807eda577f  $DEST/CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png" | sha256sum -c -
          test ! -f "$DEST/CMP-FRAME-CHASHOU-001_MASTER_V001.blend"
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json").read_text())
          reg=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json").read_text())
          assert cat["approved_master_count"]==14
          ce=[x for x in cat["new_masters"] if x.get("master_id")=="CMP-FRAME-CHASHOU-001_MASTER"]
          assert len(ce)==1 and ce[0]["approval_status"]=="PRODUCT_OWNER_APPROVED"
          ch=[x for x in reg["items"] if x.get("component")=="叉手"]
          assert len(ch)==8
          assert all(x["master_coverage_status"]=="APPROVED_MASTER_AVAILABLE" and x["master_reference"]=="CMP-FRAME-CHASHOU-001_MASTER" for x in ch)
          p=reg["stage1_master_progress_summary"]
          assert (p["approved_master_count"],p["pending_master_object_type_count"],p["master_completion_percent"],p["master_covered_registry_record_count"])==(14,14,50.0,119)
          print("T028_FORMALIZATION_CROSSCHECK_PASS")
          PY

      - name: Commit exact approved formalization to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "T-028: materialize D-111 approved first article and bind Catalog/V008"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "T028_FORMALIZATION_PUSH_PASS"
