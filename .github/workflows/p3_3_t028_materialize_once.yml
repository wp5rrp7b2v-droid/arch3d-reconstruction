name: T-028 One-time Approved Artifact Materialization

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.event.pull_request.number == 16 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T-028 PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download D-111 accepted first article
        uses: actions/download-artifact@v4
        with:
          name: P3_3_T-028_MASTER_V2_FIRST_ARTICLE_V001
          path: /tmp/t028-approved
          github-token: ${{ github.token }}
          repository: wp5rrp7b2v-droid/arch3d-reconstruction
          run-id: 35825911214

      - name: Verify exact accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/t028-approved
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          echo "25da16f9e69c930ff4b37523c23bb19ac7ef1f3c5dcf2ffcc7dcaf17f35eff25  CMP-FRAME-CHASHOU-001_MASTER_V001.blend" | sha256sum -c -
          echo "28ccd0ea91f8935ebbeaa7c4c9be59ea1bd25c8acc790cbec53342477d86f05d  CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json" | sha256sum -c -
          echo "e8cb259cb5fa9be474bce120c0984ae02c7159c1ad27bdc5d63deb457c4dcde6  CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json" | sha256sum -c -
          echo "07bf0761410b3db9c7bc00161a04a34027ca7711f38437978715f3807eda577f  CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          echo "338c885cb4cc453edc909ea100637ef714865764a3b0b682f23c6250264b59db  production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001/CMP-FRAME-CHASHOU-001_MASTER_DEFINITION_V001.json" | sha256sum -c -
          echo "T028_APPROVED_BYTE_IDENTITY_PASS"

      - name: Materialize approved formal outputs
        shell: bash
        run: |
          set -euo pipefail
          DEST="production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001"
          mkdir -p "$DEST"
          cp /tmp/t028-approved/CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json "$DEST/"
          cp /tmp/t028-approved/CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json "$DEST/"
          cp /tmp/t028-approved/CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png "$DEST/"
          python scripts/t028_materialize_once.py
          rm -f .github/workflows/p3_3_t028_materialize_once.yml scripts/t028_materialize_once.py

      - name: Cross-check formalization surface
        shell: bash
        run: |
          set -euo pipefail
          DEST="production/zhenguo_wanfo/component_library/masters/CMP-FRAME-CHASHOU-001"
          echo "28ccd0ea91f8935ebbeaa7c4c9be59ea1bd25c8acc790cbec53342477d86f05d  $DEST/CMP-FRAME-CHASHOU-001_MASTER_SEMANTIC_V001.json" | sha256sum -c -
          echo "e8cb259cb5fa9be474bce120c0984ae02c7159c1ad27bdc5d63deb457c4dcde6  $DEST/CMP-FRAME-CHASHOU-001_MASTER_VALIDATION_V001.json" | sha256sum -c -
          echo "07bf0761410b3db9c7bc00161a04a34027ca7711f38437978715f3807eda577f  $DEST/CMP-FRAME-CHASHOU-001_MASTER_REVIEW_BOARD_V001.png" | sha256sum -c -
          test ! -f "$DEST/CMP-FRAME-CHASHOU-001_MASTER_V001.blend"
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path("production/zhenguo_wanfo/registry/P3_3_STAGE1_COMPONENT_MASTER_LIBRARY_V001.json").read_text())
          reg=json.loads(Path("docs/evidence/zhenguo_wanfo/P3_WANFO_COMPONENT_INSTANCE_REGISTRY_CURRENT.json").read_text())
          assert cat["approved_master_count"]==14
          ce=[x for x in cat["new_masters"] if x.get("master_id")=="CMP-FRAME-CHASHOU-001_MASTER"]
          assert len(ce)==1 and ce[0]["approval_status"]=="PRODUCT_OWNER_APPROVED"
          ch=[x for x in reg["items"] if x.get("component")=="叉手"]
          assert len(ch)==8
          assert all(x["master_coverage_status"]=="APPROVED_MASTER_AVAILABLE" and x["master_reference"]=="CMP-FRAME-CHASHOU-001_MASTER" for x in ch)
          p=reg["stage1_master_progress_summary"]
          assert (p["approved_master_count"],p["pending_master_object_type_count"],p["master_completion_percent"],p["master_covered_registry_record_count"])==(14,14,50.0,119)
          print("T028_FORMALIZATION_CROSSCHECK_PASS")
          PY

      - name: Commit exact approved formalization to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "T-028: materialize D-111 approved first article and bind Catalog/V008"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "T028_FORMALIZATION_PUSH_PASS"
