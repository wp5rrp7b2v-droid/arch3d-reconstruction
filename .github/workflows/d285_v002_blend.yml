name: D285 approved V002 BLEND finalization
on:
  push:
    branches: [docs/d285-curved-gong-v002-approved-2026-10-09]
    paths:
      - .github/workflows/d285_v002_blend.yml
      - production/zhenguo_wanfo/assembly/approved_snapshots/2026-10-09/curved_gong_v002/finalization/**
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: python -m pip install numpy==2.5.3 trimesh==5.1.1 manifold3d==3.5.4 networkx==3.4.2
      - name: Install Blender 4.5.13
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1
          curl --fail --location --show-error --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Verify approved input, build, independently reopen, validate
        env:
          TASK_ROOT: production/zhenguo_wanfo/assembly/approved_snapshots/2026-10-09/curved_gong_v002/finalization
        run: |
          gzip -dk "$TASK_ROOT/APPROVED_GEOMETRY_V002.json.gz"
          cd "$TASK_ROOT"
          sha256sum -c INPUT_SHA256.txt
          cd "$GITHUB_WORKSPACE"
          /tmp/blender-4.5.13-linux-x64/blender --background --factory-startup --python-exit-code 10 --python "$TASK_ROOT/blender_roundtrip.py" -- build "$TASK_ROOT"
          /tmp/blender-4.5.13-linux-x64/blender --background --factory-startup --python-exit-code 10 --python "$TASK_ROOT/blender_roundtrip.py" -- reopen "$TASK_ROOT"
          python "$TASK_ROOT/validate_roundtrip.py" "$TASK_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: WANFO_APPROVED_V002_BLEND_ROUNDTRIP
          path: production/zhenguo_wanfo/assembly/approved_snapshots/2026-10-09/curved_gong_v002/finalization/output/
          if-no-files-found: error
          retention-days: 90
